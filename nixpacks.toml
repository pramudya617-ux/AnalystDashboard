# Railway memakai Nixpacks, dan untuk proyek ini ia akan mengenali Node saja.
# Padahal penarik Zora ditulis dengan Python, jadi python3 HARUS diminta secara
# eksplisit - tanpa baris ini penjadwal gagal di server dengan
# "spawn python ENOENT" sementara di laptop berjalan normal.
#
# Tidak ada requirements.txt: tarik_zora.py dan dns_doh.py hanya memakai pustaka
# bawaan Python, jadi tidak ada yang perlu di-pip install.

[phases.setup]
nixPkgs = ["nodejs_22", "python311"]

# JANGAN menambahkan "npm ci" di sini. Nixpacks sudah menjalankannya di fase
# install-nya sendiri, dan menjalankannya lagi di fase build menghapus seluruh
# node_modules termasuk /app/node_modules/.cache yang saat itu sedang dipasang
# sebagai cache mount - foldernya terkunci dan build gagal dengan EBUSY.
[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
